[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroflow"
version = "0.1.0"
description = "hydroflow: a distributed, physics-based hydrological + hydrodynamic model — DEM preprocessing, gauge/IMERG precipitation, VSA + Green-Ampt + impervious runoff generation, and kinematic/diffusive-wave/Muskingum–Cunge routing, with optional Google Earth Engine forcing and CPU/GPU backends."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Saurav Bhattarai", email = "bhattaraisaurav36@gmail.com" },
]
keywords = [
    "hydrology", "hydrodynamics", "watershed", "runoff", "flood",
    "routing", "kinematic wave", "diffusive wave", "muskingum-cunge",
    "VSA", "OPM", "green-ampt", "GIS", "rainfall-runoff", "earth-engine",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "rasterio",
    "geopandas",
    "shapely",
    "pyproj",
    "pysheds",
    "pyflwdir",
    "fiona",
    "pyyaml",
]

[project.optional-dependencies]
# GPU acceleration (requires CUDA 12.x)
gpu = ["cupy-cuda12x"]
# Google Earth Engine features (IMERG rainfall, SERVES deficit, SoilGrids, LULC/LCZ)
gee = ["earthengine-api"]

[project.scripts]
hydroflow = "hydroflow.cli.main:main"

[project.urls]
Homepage = "https://github.com/SauravBhattarai19/One-Parameter-Hydrologic-Model"
Documentation = "https://sauravbhattarai19.github.io/One-Parameter-Hydrologic-Model/"
Issues = "https://github.com/SauravBhattarai19/One-Parameter-Hydrologic-Model/issues"

[tool.setuptools.packages.find]
include = ["hydroflow*"]

[tool.setuptools.package-data]
hydroflow = ["data/*.csv"]
