# Read the Docs build config — https://docs.readthedocs.io/en/stable/config-file/
# Hosts the mkdocs site (docsite/ + mkdocs.yml) at pyhydroflow.readthedocs.io.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # install hydroflow so mkdocstrings can import it for the API reference
    - method: pip
      path: .
    - requirements: docs-requirements.txt
